# ============================================================================
# Nginx 虚拟主机配置 — 博客站点
# ============================================================================
#
# 【Nginx 配置文件加载机制】
#   Nginx 主配置文件是 /etc/nginx/nginx.conf，其中有一行：
#     include /etc/nginx/conf.d/*.conf;
#   意思是自动加载 conf.d/ 目录下所有 .conf 结尾的文件。
#   所以我们把配置放在 /etc/nginx/conf.d/blog.conf，Nginx 会自动读取。
#   这种"一个站点一个文件"的方式比把所有配置挤在 nginx.conf 里更清晰。
#
# 【部署方式】
#   将此文件复制到 ECS 上：
#     cp deploy/nginx/blog.conf /etc/nginx/conf.d/blog.conf
#   检查语法 + 重载：
#     nginx -t && systemctl reload nginx
#
# 【HTTPS 配置】
#   本文件先配置 HTTP（80端口）。
#   配置好域名解析后，运行 certbot --nginx -d your-domain.com，
#   certbot 会自动修改此文件，添加 SSL 证书路径和 443 监听。
#
# ============================================================================

server {
    # ── 监听端口 ──────────────────────────────────────────────────────
    # listen 80 : 监听 IPv4 的 80 端口（HTTP 标准端口）
    # listen [::]:80 : 监听 IPv6 的 80 端口
    # [::] 是 IPv6 的通配地址，等价于 IPv4 的 0.0.0.0
    # 同时监听 IPv4 和 IPv6 是最佳实践，确保所有客户端都能访问
    listen 80;
    listen [::]:80;

    # ── 域名 ──────────────────────────────────────────────────────────
    # server_name 指定这个 server 块响应哪些域名的请求。
    # Nginx 可以配置多个 server 块（多个站点），通过 server_name 区分。
    # 当请求的 Host 头匹配 server_name 时，由这个 server 块处理。
    #
    # TODO: 替换为你的实际域名
    # 如果暂时没有域名，可以用 _ （匹配所有域名）或者 ECS 公网 IP
    server_name your-domain.com;

    # ── 前端静态文件 ──────────────────────────────────────────────────
    # root: 指定文档根目录。
    # 当请求 http://your-domain.com/index.html 时，
    # Nginx 会返回 /var/www/blog/index.html 文件。
    #
    # index: 当请求的是目录（如 /）时，自动寻找 index.html 文件。
    root /var/www/blog;
    index index.html;

    # ── SPA 路由回退 ──────────────────────────────────────────────────
    # React Router 使用客户端路由（如 /posts/123、/login），
    # 这些路径在服务器上没有对应的文件。
    # 如果用户直接访问 /posts/123 或刷新页面，Nginx 会返回 404。
    #
    # try_files 指令解决这个问题：
    #   $uri        — 先尝试找和请求路径完全匹配的文件
    #   $uri/       — 再尝试找对应的目录
    #   /index.html — 都找不到就返回 index.html，让 React Router 在前端处理路由
    #
    # 这和之前在 Vercel 上配置 rewrites 是同一个原理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── GraphQL API 反向代理 ──────────────────────────────────────────
    # 所有 /graphql 开头的请求转发到后端 Node.js 服务。
    #
    # 【什么是反向代理】
    #   正向代理：客户端通过代理访问服务器（如 VPN、科学上网）
    #   反向代理：服务器端的代理，客户端不知道后面有几台服务器
    #   Nginx 作为反向代理，对外统一暴露 80/443 端口，
    #   内部把请求分发到不同的后端服务。
    #
    # proxy_pass http://127.0.0.1:4000 :
    #   把请求转发到本机的 4000 端口（后端 Docker 容器映射的端口）
    #   使用 127.0.0.1 而不是容器名，因为 Nginx 运行在宿主机上，不在 Docker 网络里。
    #
    # proxy_set_header :
    #   转发请求时附加/修改 HTTP 头部，让后端能拿到客户端的真实信息：
    #   Host            — 原始请求的域名（否则后端看到的是 127.0.0.1:4000）
    #   X-Real-IP       — 客户端真实 IP（否则后端看到的是 Nginx 的 IP）
    #   X-Forwarded-For — 完整的代理链 IP 列表（多层代理时用到）
    #   X-Forwarded-Proto — 原始协议（http/https），后端可据此生成正确的 URL
    location /graphql {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── WebSocket 支持 ────────────────────────────────────────────
        # GraphQL Subscriptions（AI 聊天的流式响应）使用 WebSocket 协议。
        # WebSocket 连接从 HTTP 升级而来（Upgrade 握手），需要 Nginx 透传这些头：
        #
        # HTTP/1.1 — WebSocket 只支持 HTTP/1.1（不支持 HTTP/2 的 WebSocket）
        # Upgrade: websocket — 告诉服务器客户端想升级到 WebSocket 协议
        # Connection: "upgrade" — 配合 Upgrade 头使用
        #
        # $http_upgrade 是 Nginx 变量，值为客户端请求中的 Upgrade 头。
        # 如果不是 WebSocket 请求，$http_upgrade 为空，这些头也为空，不影响普通 HTTP 请求。
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ── 超时设置 ──────────────────────────────────────────────────
        # WebSocket 是长连接，默认的 60 秒超时会导致空闲连接被断开。
        # 设为 1 小时，适合 AI 聊天场景（用户可能长时间保持连接）。
        # 如果连接超过 1 小时没有数据传输，Nginx 会主动断开。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────────
    # Vite 构建的 JS/CSS 文件名包含内容哈希（如 index-a1b2c3.js），
    # 文件内容变了，文件名就会变，所以可以安全地设置长期缓存。
    #
    # ~* 表示正则匹配且不区分大小写。
    # \.(js|css|png|...) 匹配这些后缀的文件。
    #
    # Cache-Control: public — 允许 CDN 和浏览器缓存
    # max-age=31536000     — 缓存 1 年（365天 × 24小时 × 3600秒）
    # immutable            — 告诉浏览器这个文件永远不会变，不用发条件请求验证
    #
    # access_log off — 静态资源不记录访问日志，减少日志量和 I/O
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Gzip 压缩 ─────────────────────────────────────────────────────
    # 压缩响应体可以显著减少传输数据量（通常压缩率 60-80%），加快页面加载速度。
    #
    # gzip on              — 启用 gzip 压缩
    # gzip_vary on         — 在响应头加 Vary: Accept-Encoding，
    #                        告诉 CDN/缓存代理：同一 URL 可能有压缩和非压缩两个版本
    # gzip_min_length 1024 — 小于 1KB 的响应不压缩（压缩太小的文件反而增加 CPU 开销）
    # gzip_comp_level 5    — 压缩级别 1-9，5 是性价比最优（压缩率高但 CPU 开销适中）
    # gzip_types           — 哪些 MIME 类型需要压缩（图片和视频已经是压缩格式，不需要再压缩）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
