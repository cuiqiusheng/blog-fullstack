# ============================================================================
# Nginx 虚拟主机配置 — 博客站点（HTTPS）
# ============================================================================
#
# 【部署方式】
#   将此文件复制到 ECS 上：
#     cp deploy/nginx/blog.conf /etc/nginx/conf.d/blog.conf
#   修改 server_name 为你的实际域名，然后：
#     nginx -t && systemctl reload nginx
#
# 【SSL 证书】
#   使用 Let's Encrypt 免费证书，通过 certbot 申请：
#     certbot certonly --manual --preferred-challenges dns -d blog.cuiqs.com
#   证书文件位于 /etc/letsencrypt/live/<域名>/
#   certbot 自动配置定时续期任务。
#
# ============================================================================

# ── HTTP → HTTPS 重定向 ──────────────────────────────────────────────
# 所有 HTTP 请求 301 永久重定向到 HTTPS。
# 301 会被浏览器缓存，后续访问直接走 HTTPS，减少一次 HTTP 往返。
# $host 保留原始域名，$request_uri 保留完整路径和查询参数。
server {
    listen 80;
    listen [::]:80;
    server_name blog.cuiqs.com;

    # Certbot 验证路径（证书续期时需要，备案通过后生效）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/blog;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主配置 ─────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.cuiqs.com;

    # ── SSL 证书 ──────────────────────────────────────────────────────
    # fullchain.pem  : 服务器证书 + 中间证书（完整证书链）
    # privkey.pem    : 证书私钥
    ssl_certificate /etc/letsencrypt/live/blog.cuiqs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.cuiqs.com/privkey.pem;

    # ── SSL 安全参数 ──────────────────────────────────────────────────
    # TLSv1.2 和 TLSv1.3 是目前安全的 TLS 版本（TLSv1.0/1.1 已被废弃）
    # ssl_prefer_server_ciphers on : 优先使用服务器端配置的加密套件，而非客户端的
    # ssl_session_cache shared:SSL:10m : 多个 worker 进程共享 SSL 会话缓存，
    #   10MB 大约可以缓存 4 万个会话，避免重复握手
    # ssl_session_timeout 10m : 缓存的 SSL 会话 10 分钟内可复用
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── 前端静态文件 ──────────────────────────────────────────────────
    root /var/www/blog;
    index index.html;

    # ── SPA 路由回退 ──────────────────────────────────────────────────
    # React Router 使用客户端路由（如 /posts/123、/login），
    # 这些路径在服务器上没有对应的文件。
    # try_files 先找真实文件，找不到就返回 index.html，让前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 上传凭证 API 反向代理 ────────────────────────────────────────
    # /upload/token 转发到后端 Node.js 服务，用于获取七牛云上传凭证。
    location /upload/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── GraphQL API 反向代理 ──────────────────────────────────────────
    # 所有 /graphql 请求转发到后端 Node.js 服务（Docker 容器 :4000）。
    # 使用 127.0.0.1 因为 Nginx 在宿主机上，不在 Docker 网络里。
    location /graphql {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（GraphQL Subscriptions / AI 聊天流式响应）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WebSocket 长连接超时（1 小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 存量图片 URL：/cdn/ → 自定义 CDN 域名（301） ─────────────────
    # 历史上传返回的是 https://blog.cuiqs.com/cdn/<key>，其中 <key> 为对象路径
    #（如 uploads/2026/03/xxx.jpg）。原先用 proxy_pass 到七牛测试域，等价于
    # 把 /cdn/ 剥掉后回源；七牛对象 key 本身不含 "cdn/" 前缀。
    # 现已启用 https://cdn.cuiqs.com，故对旧链接发 301 到同一 key，由浏览器
    # 直连 CDN，减轻 ECS 带宽并统一对外域名。新上传应已由 QINIU_CDN_DOMAIN
    # 直接生成 cdn.cuiqs.com 链接，不再依赖本段。
    location ^~ /cdn/ {
        rewrite ^/cdn/(.*)$ https://cdn.cuiqs.com/$1 permanent;
        access_log off;
    }

    # ── 静态资源缓存 ──────────────────────────────────────────────────
    # Vite 构建的 JS/CSS 文件名包含内容哈希，内容变则文件名变，
    # 可以安全设置长期缓存（1 年）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Gzip 压缩 ─────────────────────────────────────────────────────
    # 压缩率通常 60-80%，显著减少传输数据量。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;
}
