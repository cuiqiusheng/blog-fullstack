[project]
name = "ai-service"
version = "0.1.0"
description = "AI column backend - fetch, generate, schedule AI content, REST API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "uvicorn[standard]>=0.47.0",
    "httpx>=0.28.1",
    "arxiv>=4.0.0",
    "langgraph>=1.2.1",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
