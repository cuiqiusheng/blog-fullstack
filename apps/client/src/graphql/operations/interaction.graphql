mutation ToggleLike($postId: ID!) {
  toggleLike(postId: $postId) {
    liked
    likeCount
    bookmarked
    bookmarkCount
    commentCount
  }
}

mutation ToggleBookmark($postId: ID!) {
  toggleBookmark(postId: $postId) {
    liked
    likeCount
    bookmarked
    bookmarkCount
    commentCount
  }
}

mutation CreateComment($postId: ID!, $content: String!, $parentId: ID) {
  createComment(postId: $postId, content: $content, parentId: $parentId) {
    id
    content
    parentId
    author {
      id
      email
      nickname
      avatarUrl
    }
    createdAt
    updatedAt
  }
}

mutation DeleteComment($id: ID!) {
  deleteComment(id: $id)
}

query Comments($postId: ID!, $limit: Int, $offset: Int) {
  comments(postId: $postId, limit: $limit, offset: $offset) {
    id
    content
    parentId
    repliesCount
    author {
      id
      email
      nickname
      avatarUrl
    }
    replies {
      id
      content
      parentId
      author {
        id
        email
        nickname
        avatarUrl
      }
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}

query CommentsTotal($postId: ID!) {
  commentsTotal(postId: $postId)
}

query CommentReplies($commentId: ID!, $limit: Int, $offset: Int) {
  commentReplies(commentId: $commentId, limit: $limit, offset: $offset) {
    id
    content
    parentId
    author {
      id
      email
      nickname
      avatarUrl
    }
    createdAt
    updatedAt
  }
}

query MyBookmarks($limit: Int, $offset: Int) {
  myBookmarks(limit: $limit, offset: $offset) {
    id
    title
    excerpt
    topic
    subtopic
    status
    createdAt
    updatedAt
    author {
      id
      email
      nickname
      avatarUrl
    }
    interactionInfo {
      liked
      likeCount
      bookmarked
      bookmarkCount
      commentCount
    }
  }
}

query MyBookmarksTotal {
  myBookmarksTotal
}

query MyInteractionStats {
  myInteractionStats {
    totalLikesReceived
    totalBookmarks
    totalComments
  }
}
