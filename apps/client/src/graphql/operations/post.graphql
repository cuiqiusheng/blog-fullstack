query Posts(
  $topic: String
  $subtopic: String
  $status: PostStatus
  $search: String
  $sortBy: PostSortField
  $sortDirection: SortDirection
  $mine: Boolean
  $authorId: ID
  $limit: Int
  $offset: Int
) {
  posts(
    topic: $topic
    subtopic: $subtopic
    status: $status
    search: $search
    sortBy: $sortBy
    sortDirection: $sortDirection
    mine: $mine
    authorId: $authorId
    limit: $limit
    offset: $offset
  ) {
    id
    title
    excerpt
    topic
    subtopic
    seriesKey
    seriesOrder
    status
    publishedAt
    source
    wordCount
    generationBatchId
    createdAt
    updatedAt
    author {
      id
      email
      nickname
      avatarUrl
      roles {
        id
        name
      }
    }
    interactionInfo {
      liked
      likeCount
      bookmarked
      bookmarkCount
      commentCount
    }
  }
}

query PostsTotal(
  $topic: String
  $subtopic: String
  $status: PostStatus
  $search: String
  $mine: Boolean
) {
  postsTotal(topic: $topic, subtopic: $subtopic, status: $status, search: $search, mine: $mine)
}

query Post($id: ID!) {
  post(id: $id) {
    id
    title
    content
    topic
    subtopic
    seriesKey
    seriesOrder
    status
    publishedAt
    source
    wordCount
    generationBatchId
    createdAt
    updatedAt
    author {
      id
      email
      nickname
      avatarUrl
      roles {
        id
        name
      }
    }
    interactionInfo {
      liked
      likeCount
      bookmarked
      bookmarkCount
      commentCount
    }
  }
}

query PostNeighbors($id: ID!) {
  postNeighbors(id: $id) {
    prev {
      id
      title
      seriesKey
      seriesOrder
    }
    next {
      id
      title
      seriesKey
      seriesOrder
    }
  }
}

mutation CreatePost($input: CreatePostInput!) {
  createPost(input: $input) {
    id
    title
    status
    createdAt
  }
}

mutation UpdatePost($id: ID!, $input: UpdatePostInput!) {
  updatePost(id: $id, input: $input) {
    id
    title
    status
    updatedAt
  }
}

mutation DeletePost($id: ID!) {
  deletePost(id: $id)
}

