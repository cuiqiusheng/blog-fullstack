enum PostStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

type Post {
  id: ID!
  title: String!
  content: String!
  topic: String
  subtopic: String
  status: PostStatus!
  publishedAt: String
  source: String
  wordCount: Int
  generationBatchId: String
  createdAt: String!
  updatedAt: String!
  author: User!
}

type GenerationItemResult {
  topic: String!
  subtopic: String!
  success: Boolean!
  skipped: Boolean!
  retryCount: Int!
  title: String
  postId: ID
  wordCount: Int
  error: String
}

type GenerationBatchReport {
  batchId: String!
  requested: Int!
  success: Int!
  failed: Int!
  skipped: Int!
  startedAt: String!
  finishedAt: String!
  results: [GenerationItemResult!]!
}

input GenerationPlanInput {
  topic: String!
  subtopics: [String!]!
}

input GeneratePostsInput {
  plans: [GenerationPlanInput!]!
  countPerSubtopic: Int
  minWords: Int
  maxWords: Int
  concurrency: Int
  maxRetries: Int
  temperature: Float
  autoPublish: Boolean
}

extend type Query {
  posts(topic: String, subtopic: String, status: PostStatus, limit: Int, offset: Int): [Post!]!
  generationBatch(batchId: String!): GenerationBatchReport!
}

extend type Mutation {
  generatePosts(input: GeneratePostsInput!): GenerationBatchReport!
  retryGenerationBatch(batchId: String!, countPerSubtopic: Int): GenerationBatchReport!
}

