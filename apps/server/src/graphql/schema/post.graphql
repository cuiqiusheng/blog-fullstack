enum PostStatus {
  DRAFT
  PUBLISHED
  ARCHIVED
}

enum PostSortField {
  CREATED_AT
  UPDATED_AT
  SUBTOPIC
}

enum SortDirection {
  ASC
  DESC
}

type Post {
  id: ID!
  title: String!
  content: String!
  excerpt: String
  topic: String
  subtopic: String
  seriesKey: String
  seriesOrder: Int
  status: PostStatus!
  publishedAt: String
  source: String
  wordCount: Int
  generationBatchId: String
  createdAt: String!
  updatedAt: String!
  author: User!
}

type PostNeighbors {
  prev: Post
  next: Post
}

type GenerationItemResult {
  topic: String!
  subtopic: String!
  success: Boolean!
  skipped: Boolean!
  retryCount: Int!
  title: String
  postId: ID
  wordCount: Int
  error: String
}

type GenerationBatchReport {
  batchId: String!
  requested: Int!
  success: Int!
  failed: Int!
  skipped: Int!
  startedAt: String!
  finishedAt: String!
  results: [GenerationItemResult!]!
}

input GenerationPlanInput {
  topic: String!
  subtopics: [String!]!
}

input GeneratePostsInput {
  plans: [GenerationPlanInput!]!
  countPerSubtopic: Int
  minWords: Int
  maxWords: Int
  concurrency: Int
  maxRetries: Int
  temperature: Float
  autoPublish: Boolean
}

extend type Query {
  post(id: ID!): Post
  postNeighbors(id: ID!): PostNeighbors!
  posts(
    topic: String
    subtopic: String
    status: PostStatus
    search: String
    sortBy: PostSortField
    sortDirection: SortDirection
    mine: Boolean
    authorId: ID
    limit: Int
    offset: Int
  ): [Post!]!
  postsTotal(
    topic: String
    subtopic: String
    status: PostStatus
    search: String
    mine: Boolean
  ): Int!
  generationBatch(batchId: String!): GenerationBatchReport!
}

input CreatePostInput {
  title: String!
  content: String!
  topic: String
  subtopic: String
  status: PostStatus
}

input UpdatePostInput {
  title: String
  content: String
  topic: String
  subtopic: String
  status: PostStatus
}

extend type Mutation {
  createPost(input: CreatePostInput!): Post!
  updatePost(id: ID!, input: UpdatePostInput!): Post!
  deletePost(id: ID!): Boolean!
  generatePosts(input: GeneratePostsInput!): GenerationBatchReport!
  retryGenerationBatch(batchId: String!, countPerSubtopic: Int): GenerationBatchReport!
}

