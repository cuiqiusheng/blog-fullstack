# ============================================================================
# GitHub Action — 将代码镜像到 GitLab
# ============================================================================
#
# 当 main 分支有推送时，自动将完整的 Git 历史同步到 GitLab 仓库。
# GitLab 检测到新的推送后会自动触发 .gitlab-ci.yml 中定义的流水线。
#
# 【前置配置】
#   在 GitHub 仓库 Settings > Secrets and variables > Actions 中添加：
#     GITLAB_TOKEN — GitLab Personal Access Token（scope: write_repository）
#     GITLAB_REPO  — GitLab 仓库地址（如 gitlab.com/username/blog-fullstack.git）
#
# ============================================================================

name: Mirror to GitLab

on:
  push:
    branches: [main]

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        run: |
          git remote add gitlab "https://oauth2:${{ secrets.GITLAB_TOKEN }}@${{ secrets.GITLAB_REPO }}"
          git push gitlab main --force
          git push gitlab --tags --force
