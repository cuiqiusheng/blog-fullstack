# ============================================================================
# GitLab CI/CD — 博客自动构建与部署
# ============================================================================
#
# 【工作原理】
#   1. 代码推送到 GitHub main 分支
#   2. GitHub Action 将代码镜像到 GitLab
#   3. GitLab 检测到推送，将此流水线分配给 ECS 上的 Runner（shell executor）
#   4. Runner 在 ECS 上执行：安装依赖 → 构建前端 → 部署前端 → 构建并部署后端
#
# 【Runner 要求】
#   - Executor 类型：shell（直接在 ECS 宿主机上执行命令）
#   - gitlab-runner 用户需要 docker 组权限（setup-ecs.sh 已配置）
#   - gitlab-runner 用户需要 /var/www/blog/ 和 /opt/blog/ 的写权限（setup-ecs.sh 已配置）
#   - gitlab-runner 用户需要 nvm + Node.js + pnpm 环境（setup-ecs.sh 已配置）
#
# 【为什么只有一个阶段】
#   构建和部署都在同一台 ECS 上执行（shell executor），拆分成多个阶段
#   不会带来隔离性或并行性收益，反而引入 artifact 传递和 env 文件同步的复杂度。
#   单阶段流水线更简洁可靠，任何一步失败都会立即终止，不会误部署。
#
# ============================================================================

stages:
  - deploy

default:
  tags:
    - ecs-blog-runner
  before_script:
    - export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"

deploy:
  stage: deploy
  resource_group: blog-prod-deploy
  script:
    # 安装依赖（--frozen-lockfile 确保使用锁文件中的精确版本，不自动升级）
    - pnpm install --frozen-lockfile

    # ── 构建前端 ──────────────────────────────────────────────────────
    # VITE_GRAPHQL_URI=/graphql：
    #   生产环境前端和后端共用同一域名，Nginx 代理 /graphql 到后端，
    #   不需要开发时的 /api 前缀重写。
    # 若出现 "Killed"（OOM）：ECS 内存不足。按优先级可采取：
    #   1) 确保已启用 2GB swap：在 ECS 上执行 scripts/setup-ecs.sh（推荐）
    #   2) 若实例 ≥3GB 内存，可改为 --max-old-space-size=1536 或 2048
    #   3) 在 Docker 中构建以隔离内存（宿主机 4GB 时给容器 2.5G 常可避免宿主机 OOM）：
    #      - docker run --rm -v "$(pwd)":/app -w /app --memory=2.5g -e NODE_OPTIONS=--max-old-space-size=1536 -e VITE_GRAPHQL_URI=/graphql -e CI=true node:20-alpine sh -c "corepack enable pnpm && pnpm install --frozen-lockfile && pnpm --filter @blog-fullstack/client build"
    #      - 然后下面 rsync 步骤不变（产物在 apps/client/dist）
    #   4) 升级 ECS 实例（建议构建机至少 2GB 内存，推荐 4GB）
    - NODE_OPTIONS=--max-old-space-size=1024 VITE_GRAPHQL_URI=/graphql pnpm --filter @blog-fullstack/client build

    # ── 部署前端 ──────────────────────────────────────────────────────
    # rsync 只传输变更的文件，比 cp 更高效。
    #   -a : archive（递归 + 保留权限/时间戳）
    #   --delete : 删除目标目录中源没有的文件，保持完全一致
    #   --exclude .well-known/ : 保留 Nginx/Certbot 的 ACME 校验目录；该目录常为 root
    #   所有且不在前端构建产物中，若被 --delete 尝试清除会因权限失败导致 rsync 退出码 23
    - rsync -av --delete --exclude='.well-known/' apps/client/dist/ /var/www/blog/

    # ── 数据库备份 + 迁移 + 后端部署 ─────────────────────────────────────
    # 1. 复制 .env 到 deploy/，并导出环境变量（供 Prisma migrate 使用）
    # 2. 迁移前先做 PostgreSQL 逻辑备份（本地保留 + 可选上传七牛）
    # 3. 执行生产迁移（prisma migrate deploy；宿主机连 127.0.0.1，见下）
    # 4. 在 deploy/ 下构建镜像并启动服务
    # 5. 同步 compose 文件到 /opt/blog/
    - cp /opt/blog/.env deploy/.env
    - set -a && . /opt/blog/.env && set +a
    - mkdir -p /opt/blog/backups
    - |
      TS=$(date +%F_%H%M%S)
      BACKUP_FILE="/opt/blog/backups/blog_${TS}.sql.gz"
      docker exec blog-db pg_dump -U blog -d blog --no-owner --no-privileges | gzip > "$BACKUP_FILE"
      test -s "$BACKUP_FILE"
      echo "Database backup created: $BACKUP_FILE"
      # 若安装了 qshell 且配置了七牛变量，则自动异地备份（可选）
      if command -v qshell >/dev/null 2>&1 && [ -n "${QINIU_BACKUP_BUCKET:-}" ]; then
        REMOTE_KEY="${QINIU_BACKUP_PREFIX:-prod/postgres}/blog_${TS}.sql.gz"
        qshell rput "$QINIU_BACKUP_BUCKET" "$REMOTE_KEY" "$BACKUP_FILE"
        echo "Uploaded backup to qiniu: ${QINIU_BACKUP_BUCKET}/${REMOTE_KEY}"
      else
        echo "Skip qiniu upload (qshell or QINIU_BACKUP_BUCKET not configured)"
      fi
      # 本地仅保留最近 14 天备份
      find /opt/blog/backups -name "blog_*.sql.gz" -type f -mtime +14 -delete
    # .env 中 DATABASE_URL 使用 blog-db，供容器内 server 连接；宿主机无法解析该名。
    # compose 已将 DB 映射到 127.0.0.1:5432，迁移在 Runner 宿主机执行故需改写主机名。
    - |
      MIGRATE_DATABASE_URL=$(printf '%s' "$DATABASE_URL" | sed 's/@blog-db:/@127.0.0.1:/')
      DATABASE_URL="$MIGRATE_DATABASE_URL" pnpm --filter @blog-fullstack/server prisma:migrate:deploy
    - cd deploy
    - docker compose up -d --build --remove-orphans
    - cp docker-compose.yml /opt/blog/docker-compose.yml
    - |
      for i in $(seq 1 20); do
        if curl -fsS http://127.0.0.1:4000/health >/dev/null; then
          echo "Health check passed"
          exit 0
        fi
        sleep 3
      done
      echo "Health check failed"
      exit 1

  after_script:
    # 清理复制过来的 .env（避免敏感信息残留在构建目录中）
    - rm -f deploy/.env

  only:
    - main
