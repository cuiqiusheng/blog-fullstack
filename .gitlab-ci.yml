# ============================================================================
# GitLab CI/CD — 博客自动构建与部署
# ============================================================================
#
# 【工作原理】
#   1. 代码推送到 GitHub main 分支
#   2. GitHub Action 将代码镜像到 GitLab
#   3. GitLab 检测到推送，将此流水线分配给 ECS 上的 Runner（shell executor）
#   4. Runner 在 ECS 上执行：安装依赖 → 构建前端 → 部署前端 → 构建并部署后端
#
# 【Runner 要求】
#   - Executor 类型：shell（直接在 ECS 宿主机上执行命令）
#   - gitlab-runner 用户需要 docker 组权限（setup-ecs.sh 已配置）
#   - gitlab-runner 用户需要 /var/www/blog/ 和 /opt/blog/ 的写权限（setup-ecs.sh 已配置）
#   - gitlab-runner 用户需要 nvm + Node.js + pnpm 环境（setup-ecs.sh 已配置）
#
# 【为什么只有一个阶段】
#   构建和部署都在同一台 ECS 上执行（shell executor），拆分成多个阶段
#   不会带来隔离性或并行性收益，反而引入 artifact 传递和 env 文件同步的复杂度。
#   单阶段流水线更简洁可靠，任何一步失败都会立即终止，不会误部署。
#
# ============================================================================

stages:
  - deploy

default:
  tags:
    - ecs-blog-runner
  before_script:
    - export NVM_DIR="$HOME/.nvm" && . "$NVM_DIR/nvm.sh"

deploy:
  stage: deploy
  script:
    # 安装依赖（--frozen-lockfile 确保使用锁文件中的精确版本，不自动升级）
    - pnpm install --frozen-lockfile

    # ── 构建前端 ──────────────────────────────────────────────────────
    # VITE_GRAPHQL_URI=/graphql：
    #   生产环境前端和后端共用同一域名，Nginx 代理 /graphql 到后端，
    #   不需要开发时的 /api 前缀重写。
    - VITE_GRAPHQL_URI=/graphql pnpm --filter @blog-fullstack/client build

    # ── 部署前端 ──────────────────────────────────────────────────────
    # rsync 只传输变更的文件，比 cp 更高效。
    #   -a : archive（递归 + 保留权限/时间戳）
    #   --delete : 删除目标目录中源没有的文件，保持完全一致
    - rsync -av --delete apps/client/dist/ /var/www/blog/

    # ── 构建并部署后端 ────────────────────────────────────────────────
    # 将 ECS 上持久化的 .env 复制到 deploy/ 目录，
    # docker-compose.yml 中的 env_file 相对于 compose 文件查找。
    - cp /opt/blog/.env deploy/.env
    - cd deploy
    - docker compose up -d --build
    # --build : 根据 Dockerfile 重新构建镜像
    # -d      : detached（后台运行）

  after_script:
    # 清理复制过来的 .env（避免敏感信息残留在构建目录中）
    - rm -f deploy/.env

  only:
    - main
